<div class="inventory-module">
  
  <div class="inventory-header">
    <h1 class="inventory-title">Control de Empleados</h1>
    <button id="open-modal-btn" class="btn btn-primary" (click)="abrirModal()">
      <span class="btn-icon">+</span> Registrar Empleado
    </button>
  </div>

  <!-- SECCIÓN DE FILTROS -->
  <div class="filters-container">
    <div class="filter-group">
      <label for="filter-name">Nombre:</label>
      <input type="text" id="filter-name" placeholder="Buscar empleado...">
    </div>

    <div class="filter-group">
      <label for="filter-puesto">Puesto / Área:</label>
      <select id="filter-puesto">
        <option value="" disabled selected>Seleccionar</option>
        <option value="Administración">Administración</option>
        <option value="Operario">Operario</option>
        <option value="Logística">Logística</option>
      </select>
    </div>

    <button class="btn btn-search">Buscar</button>
  </div>

  <!-- TABLA DE EMPLEADOS -->
  <div class="table-responsive">
    <table class="inventory-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre Completo</th>
          <th>Puesto</th>
          <th>Teléfono</th>
          <th>Correo Electrónico</th>
          <th>Salario Base</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>#EMP-01</strong></td>
          <td>Carlos Mendoza Ruiz</td>
          <td>Administración</td>
          <td>2711234567</td>
          <td>carlos.m@multiservicios.com</td>
          <td class="text-center">$12,500.00</td>
          <td><span class="badge badge-success">Activo</span></td>
          <td>
            <div class="action-buttons">
              <button class="btn-action edit" title="Editar">✏️</button>
              <button class="btn-action delete" title="Dar de Baja">🗑️</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- VENTANA EMERGENTE (MODAL) -->
  <div id="employee-modal" class="modal-overlay" [class.is-visible]="isModalOpen" (click)="cerrarModalDesdeAfuera($event)">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Registrar Nuevo Empleado</h2>
        <button type="button" id="close-modal-x" class="modal-close-x" (click)="cerrarModal()">&times;</button>
      </div>
      
      <form id="modal-form" class="modal-body" #empleadoForm="ngForm" (ngSubmit)="guardarEmpleado($event)">
        
        <!-- Nombre Completo -->
        <div class="filter-group block-input">
          <label for="modal-nombre">Nombre Completo *</label>
          <input type="text" id="modal-nombre" name="nombre" [(ngModel)]="nuevoEmpleado.nombre" placeholder="Nombre y apellidos" required>
        </div>

        <!-- Puesto -->
        <div class="filter-group block-input">
          <label for="modal-puesto">Puesto Asignado *</label>
          <select id="modal-puesto" name="puesto" [(ngModel)]="nuevoEmpleado.puesto" required>
            <option value="" disabled selected>Seleccionar puesto</option>
            <option value="Administración">Administración</option>
            <option value="Operario">Operario</option>
            <option value="Logística">Logística</option>
            <option value="Seguridad e Higiene">Seguridad e Higiene</option>
          </select>
        </div>

        <!-- Fila doble: Teléfono y Salario -->
        <div class="form-row-grid inline-quantity-unit has-material-unit">
          
          <div class="filter-group block-input">
            <label for="modal-telefono">Teléfono Movil *</label>
            <input type="text" id="modal-telefono" name="telefono" [(ngModel)]="nuevoEmpleado.telefono" (keydown)="validarTecladoTelefono($event)" placeholder="10 dígitos" maxlength="10" required>
          </div>

          <div class="filter-group block-input">
            <label for="modal-salario">Salario Mensual *</label>
            <input type="number" id="modal-salario" name="salario" [(ngModel)]="nuevoEmpleado.salario" placeholder="$ 0.00" min="1" required>
          </div>
          
        </div>

        <!-- Correo Electrónico -->
        <div class="filter-group block-input">
          <label for="modal-correo">Correo Electrónico *</label>
          <input type="email" id="modal-correo" name="correo" [(ngModel)]="nuevoEmpleado.correo" placeholder="ejemplo@correo.com" email required>
        </div>

        <!-- Acciones del Modal -->
        <div class="modal-actions">
          <button type="button" id="btn-cancel-modal" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
          <!-- Deshabilitado si el formulario no cumple las condiciones requeridas -->
          <button type="submit" class="btn btn-primary" [disabled]="empleadoForm.invalid">Guardar Empleado</button>
        </div>
      </form>
    </div>
  </div>

</div>
